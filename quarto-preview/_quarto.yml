project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - worldwide.qmd
    - methods.qmd
    - explore.qmd
    - origins.qmd
    - productivity.qmd
    - grants.qmd
    - maps.qmd
    - uk.qmd
    - population.qmd
  resources:
    - assets/origin-selector.js
    - data/uk/**
    - data/population/**
    - assets/population-core.js
    - assets/small-boats-live.js
    - maps/**
    - assets/vendor/maps/**
    - data/application-map-totals.csv
    - assets/annual-outcomes/**
    - data/annual-decision-outcomes.csv
    - assets/origins/application-volumes.csv
    - assets/origins/*.png
    - assets/origins/additional/**
    - assets/explorer-core.js
    - assets/grant-rates.js
    - assets/origin-year-cards.js
    - assets/flags/**
    - data/origin-year-explorer.json
    - data/processing-assessment.csv
    - data/processing-assessment.json
    - data/commentary-evidence.json
    - data/explorer.json
    - data/source-snapshot.zip
    - data/processing-productivity.csv
    - data/application-concentration.csv
    - data/pending-stock-series.json
    - data/origin-outcome-detail.csv
    - data/processing-gap-detail.csv
website:
  title: "Asylum in perspective"
  description: "A reader's guide to worldwide asylum applications, decisions, and pending claims."
  navbar:
    background: "#153b40"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Summary
      - href: worldwide.qmd
        text: Worldwide
      - text: Countries
        menu:
          - href: explore.qmd
            text: Receiving-country explorer
          - href: origins.qmd
            text: Origins & destinations
          - href: maps.qmd
            text: Maps
          - href: population.qmd
            text: Activity per population
      - href: productivity.qmd
        text: Processing
      - href: grants.qmd
        text: Grant rates
      - href: uk.qmd
        text: UK & Rwanda
      - href: methods.qmd
        text: Methods
    right:
      - href: https://github.com/aloysius109/python-charts/blob/main/UNHCRData.ipynb
        text: Notebook
        icon: github
  search: true
  page-footer:
    left: "An independent analysis by Kathryn Hopkins"
    right: "Source data: UNHCR · Independent analysis"
format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    toc-title: "In this chapter"
    toc-depth: 2
    number-sections: false
    link-external-newwindow: true
    fig-cap-location: bottom
    lightbox: true
    smooth-scroll: true
    anchor-sections: true
    lang: en-GB
execute:
  enabled: false
  echo: false
