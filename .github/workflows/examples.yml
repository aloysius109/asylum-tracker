name: Run bundled examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check explorer data handling
        run: python -m unittest discover -s tests -p test_explorer_data.py
      - run: python scripts/verify_examples.py
      - name: Validate and export the saved publication
        run: python scripts/publish_notebook.py
      - uses: actions/upload-artifact@v7
        with:
          name: example-outputs
          path: artifacts/
          if-no-files-found: error
