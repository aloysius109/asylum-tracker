name: Check UNHCR data and prepare review preview
on:
  push:
    branches: [main]
    paths:
      - "scripts/refresh_report.py"
      - "scripts/refresh_explorer_data.py"
      - "tests/test_refresh_report.py"
      - "tests/test_explorer_data.py"
      - "asylum-applications.csv"
      - "asylum-decisions.csv"
      - "quarto-preview/_inputs.json"
      - "quarto-preview/data/explorer.json"
      - "quarto-preview/data/pending-stock-series.json"
      - ".github/workflows/publish-quarto.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
concurrency:
  group: asylum-refresh-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check source and isolation safeguards
        run: |
          python -m unittest discover -s tests -p test_explorer_data.py
          python -m unittest discover -s tests -p test_refresh_report.py
      - name: Download sources and build a separate review preview
        run: python scripts/refresh_report.py --refresh --output artifacts/refresh-review/candidate
      - name: Save review preview, exact sources and audit (including failure details)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unhcr-refresh-review
          path: artifacts/refresh-review/candidate/
          if-no-files-found: warn
          retention-days: 30
