<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asylum Tracker</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #10233d;
      --muted: #4b5d7b;
      --brand: #0d5bd7;
      --brand-dark: #0a4cad;
      --border: rgba(16, 35, 61, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .panel {
      width: min(100%, 840px);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(16, 35, 61, 0.08);
      padding: 3rem 2rem;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--brand);
      font-weight: 700;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 6vw, 5rem);
      line-height: 1.05;
      letter-spacing: -0.05em;
    }

    p {
      max-width: 700px;
      margin: 1.2rem auto 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.7;
    }

    .actions {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    a.button {
      display: inline-block;
      padding: 0.95rem 1.5rem;
      background: var(--brand);
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 700;
      transition: background 0.2s ease;
    }

    a.button:hover {
      background: var(--brand-dark);
    }

    a.secondary {
      display: inline-block;
      padding: 0.95rem 1.5rem;
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <div class="eyebrow">Asylum statistics</div>
      <h1>Asylum Tracker</h1>
      <p>
        Explore asylum applications, decisions, country comparisons, and source-backed
        evidence in a publication-ready reporting site.
      </p>
      <div class="actions">
        <a class="button" href="asylum/">Open the report</a>
        <a class="secondary" href="https://github.com/aloysius109/asylum-tracker">View repository</a>
      </div>
    </div>
  </main>
</body>
</html>
